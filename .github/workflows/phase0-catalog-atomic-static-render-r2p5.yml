name: Verify catalog atomic static rendering (#60)
on:
  pull_request:
    branches: [catalog/rust-v0-mvp]
    paths:
      - '.github/workflows/phase0-catalog-atomic-static-render-r2p5.yml'
      - 'Catalog/**'
permissions:
  contents: read
jobs:
  atomic-static-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Check compiled Rust model and output
        shell: bash
        run: |
          set -euo pipefail
          manifest=Catalog/Cargo.toml
          rustup run 1.85.1 cargo fmt --manifest-path "$manifest" -- --check
          rustup run 1.85.1 cargo fetch --manifest-path "$manifest" --locked
          rustup run 1.85.1 cargo test --manifest-path "$manifest" --locked --offline
          rustup run 1.85.1 cargo clippy --manifest-path "$manifest" --all-targets --locked --offline -- -D warnings
          rustup run 1.85.1 cargo run --manifest-path "$manifest" --locked --offline -- render --check
