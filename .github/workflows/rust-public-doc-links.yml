name: Rust public onboarding link checker

# Validation only: no secrets, publishing, deployments, or default-branch writes.
on:
  push:
    branches:
      - phase0/public-v0
    paths:
      - .github/workflows/rust-public-doc-links.yml
      - scripts/check-public-doc-links.rs
      - README.md
      - CONTRIBUTING.md
      - GETTING-STARTED.md
      - HELP-A-PROJECT.md
      - WORKFLOW-GUIDES.md
      - TROUBLESHOOTING.md
      - BRANDING.md
      - release-kit/README-FIRST.md
      - release-kit/INSTALL-CHECKLIST.md
  pull_request:
    branches:
      - phase0/public-v0
    paths:
      - .github/workflows/rust-public-doc-links.yml
      - scripts/check-public-doc-links.rs
      - README.md
      - CONTRIBUTING.md
      - GETTING-STARTED.md
      - HELP-A-PROJECT.md
      - WORKFLOW-GUIDES.md
      - TROUBLESHOOTING.md
      - BRANDING.md
      - release-kit/README-FIRST.md
      - release-kit/INSTALL-CHECKLIST.md

permissions:
  contents: read

jobs:
  rust-public-doc-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Compile and execute Rust unit tests
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.85.1 rustc --edition=2021 -D warnings --test \
            scripts/check-public-doc-links.rs -o "$RUNNER_TEMP/free-energy-doc-link-tests"
          "$RUNNER_TEMP/free-energy-doc-link-tests" --test-threads=1
      - name: Compile and execute the real onboarding-link CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.85.1 rustc --edition=2021 -D warnings \
            scripts/check-public-doc-links.rs -o "$RUNNER_TEMP/free-energy-doc-links"
          "$RUNNER_TEMP/free-energy-doc-links" --root "$GITHUB_WORKSPACE"
      - name: Exercise compiled CLI rejection cases
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/free-energy-doc-links"
          fixture="$(mktemp -d "$RUNNER_TEMP/free-energy-doclink-fixture-XXXXXXXX")"
          outside="$(mktemp "$RUNNER_TEMP/free-energy-doclink-outside-XXXXXXXX")"
          trap 'rm -rf -- "$fixture"; rm -f -- "$outside"' EXIT
          mkdir -p "$fixture/release-kit"
          for doc in \
            README.md CONTRIBUTING.md GETTING-STARTED.md HELP-A-PROJECT.md WORKFLOW-GUIDES.md \
            TROUBLESHOOTING.md BRANDING.md \
            release-kit/README-FIRST.md release-kit/INSTALL-CHECKLIST.md; do
            : > "$fixture/$doc"
          done

          # Positive control: a real local file, an ignored external URI, and all
          # nine required inputs. This calls the compiled product CLI, not a mock.
          printf '%s\n' 'present' > "$fixture/target.md"
          printf '%s\n' '[valid](target.md)' '[external](https://example.org)' > "$fixture/README.md"
          "$binary" --root "$fixture" > "$fixture/cli-output.txt" 2>&1
          grep -Fq 'Checked 1 local links across 9 documents; 0 errors' "$fixture/cli-output.txt"

          expect_rejected() {
            local label="$1" expected="$2" exit_code=0
            "$binary" --root "$fixture" > "$fixture/cli-output.txt" 2>&1 || exit_code=$?
            if [[ "$exit_code" != 1 ]] || ! grep -Fq -- "$expected" "$fixture/cli-output.txt"; then
              echo "FAIL: $label: expected exit 1 and diagnostic '$expected', got $exit_code" >&2
              cat "$fixture/cli-output.txt" >&2
              exit 1
            fi
          }

          # Missing links in the first-party contributor guide are real failures.
          printf '%s\n' '[broken-contributing](missing-contributing.md)' > "$fixture/CONTRIBUTING.md"
          expect_rejected missing-contributor-guide-target 'target missing'
          : > "$fixture/CONTRIBUTING.md"

          printf '%s\n' '[missing](missing.md)' > "$fixture/README.md"
          expect_rejected missing-target 'target missing'

          # Repeat the same failing input: errors must be sorted and deterministic.
          cp "$fixture/cli-output.txt" "$fixture/first-output.txt"
          expect_rejected repeated-missing-target 'target missing'
          cmp "$fixture/first-output.txt" "$fixture/cli-output.txt"

          printf '%s\n' '[escape](../outside.md)' > "$fixture/README.md"
          expect_rejected lexical-traversal 'link escapes repository'

          printf '%s\n' '[percent](%ZZ)' > "$fixture/README.md"
          expect_rejected malformed-percent 'malformed percent escape'

          printf '%s\n' '[invalid-utf8](%FF)' > "$fixture/README.md"
          expect_rejected invalid-utf8 'invalid UTF-8'

          printf '%s\n' '[absolute](/etc/passwd)' > "$fixture/README.md"
          expect_rejected absolute-path 'absolute path not permitted'

          printf '%s\n' '[nested](a(b).md)' > "$fixture/README.md"
          expect_rejected unsupported-nested-destination 'unsupported nested/angle destination syntax'

          printf '%s\n' 'external file' > "$outside"
          ln -s "$outside" "$fixture/leak.md"
          printf '%s\n' '[symlink](leak.md)' > "$fixture/README.md"
          expect_rejected symlink-escape 'link escapes repository (symlink)'

          printf '%s\n' '[valid](target.md)' > "$fixture/README.md"
          rm "$fixture/BRANDING.md"
          expect_rejected missing-mandatory-document 'document unreadable or missing'

          echo 'PASS: compiled CLI positive control, contributor-link negative control and deterministic diagnostics'
