name: Rust coordination archival admission model

on:
  push:
    branches:
      - rust/coordination-archival-admission-22
      - 'test/archive-*' # validate stacked archival security/model fixes before integration
    paths:
      - 'Phase0/rust-coordination-archival/**'
      - '.github/workflows/rust-coordination-archival.yml'
  pull_request:
    branches:
      - phase0/public-v0
    paths:
      - 'Phase0/rust-coordination-archival/**'
      - '.github/workflows/rust-coordination-archival.yml'

permissions:
  contents: read

jobs:
  archival-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Phase0/rust-coordination-archival
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.85.1
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - name: Archive identifier admission regression
        run: |
          # Verify the library independently even when a separate owner's
          # integration-test source has not yet passed workspace rustfmt.
          rustup run 1.85.1 rustfmt --edition 2021 --check src/lib.rs
          rustup run 1.85.1 cargo test --lib --locked --offline
          rustup run 1.85.1 cargo clippy --lib --locked --offline -- -D warnings
      - name: Format
        run: rustup run 1.85.1 cargo fmt --all -- --check
      - name: Offline locked unit tests
        run: rustup run 1.85.1 cargo test --locked --offline
      - name: Strict Clippy
        run: rustup run 1.85.1 cargo clippy --all-targets --locked --offline -- -D warnings
