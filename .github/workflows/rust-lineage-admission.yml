name: Rust synthetic lineage admission

on:
  push:
    paths:
      - 'Phase0/rust-lineage-admission/**'
      - '.github/workflows/rust-lineage-admission.yml'
  pull_request:
    paths:
      - 'Phase0/rust-lineage-admission/**'
      - '.github/workflows/rust-lineage-admission.yml'

jobs:
  simulation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phase0/rust-lineage-admission
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.1'
          components: rustfmt, clippy
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Offline locked compiled tests
        run: cargo test --locked --offline
      - name: Strict Clippy
        run: cargo clippy --all-targets --locked --offline -- -D warnings
