name: Coordination archive maintenance

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: coordination-archive-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      archive_ref: ${{ steps.archive.outputs.archive_ref }}
      issue_number: ${{ steps.issue.outputs.issue_number }}
    steps:
      - name: Check out current default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          fetch-depth: 1

      - name: Find the configured coordination issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_AUTHORS: ${{ vars.COORDINATION_TRUSTED_AUTHORS || 'geromet' }}
        shell: bash
        run: |
          set -euo pipefail
          title=$(sed -n 's/^COORDINATION_ISSUE_TITLE=//p' Phase0/05-FLEET-CONFIG.md | head -n1)
          marker=$(sed -n 's/^COORDINATION_BODY_MARKER=//p' Phase0/05-FLEET-CONFIG.md | head -n1)
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title,body,author > "$RUNNER_TEMP/issues.json"
          number=$(python3 - "$RUNNER_TEMP/issues.json" "$title" "$marker" "$TRUSTED_AUTHORS" <<'PY'
          import json, sys
          items=json.load(open(sys.argv[1], encoding='utf-8'))
          trusted={n.strip().lower() for n in sys.argv[4].split(',') if n.strip()}
          if not trusted:
              raise SystemExit('no trusted authors configured')
          # Anyone can open an issue on a public repo: require a trusted author and the marker as the body's first line.
          hits=[x['number'] for x in items
                if x.get('title') == sys.argv[2]
                and (x.get('body') or '').split('\n', 1)[0].strip() == sys.argv[3]
                and ((x.get('author') or {}).get('login') or '').lower() in trusted]
          if len(hits) != 1:
              raise SystemExit(f'expected exactly one coordination issue, found {len(hits)}')
          print(hits[0])
          PY
          )
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Prepare archive when capacity trigger is reached
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_AUTHORS: ${{ vars.COORDINATION_TRUSTED_AUTHORS || 'geromet' }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          set -euo pipefail
          python3 scripts/coordination_archive.py prepare \
            --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE_NUMBER" \
            --trusted-authors "$TRUSTED_AUTHORS" \
            --archive-dir Phase0/archives/coordination \
            --trigger-count 1500 --tail-min 750 --segment-size 200

      - name: Propose immutable archive artifacts on a maintenance branch
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t new_files < <(
            find Phase0/archives/coordination -maxdepth 1 -type f -name 'comments-*.jsonl' -print |
              while IFS= read -r path; do
                if ! git ls-files --error-unmatch "$path" >/dev/null 2>&1; then printf '%s\n' "$path"; fi
              done | sort -V
          )
          if [ "${#new_files[@]}" -eq 0 ]; then
            echo "No new segments to propose."
            exit 0
          fi
          first=$(printf '%s\n' "${new_files[0]}" | sed -E 's/.*comments-([0-9]+)-([0-9]+)\.jsonl/\1/')
          last_index=$((${#new_files[@]} - 1))
          last=$(printf '%s\n' "${new_files[$last_index]}" | sed -E 's/.*comments-([0-9]+)-([0-9]+)\.jsonl/\2/')
          branch="maintenance/coordination-archive-${first}-${last}"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Archive PR #$existing is already open; using its branch as the verified archive ref."
            echo "archive_ref=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_ID}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Phase0/archives/coordination/manifest.json "${new_files[@]}"
          git commit -m "Archive coordination history ${first}-${last}"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "Phase0: archive coordination history ${first}-${last}" \
            --body "Adds immutable coordination comment segments and their manifest hashes. Archive bytes are read back from this branch before any optional compaction. No default-branch writes are performed."
          echo "archive_ref=$branch" >> "$GITHUB_OUTPUT"

  compact:
    needs: prepare
    if: ${{ vars.ARCHIVE_DELETE_ENABLED == 'true' && needs.prepare.outputs.archive_ref != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out archive branch for verified read-back
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.archive_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compact only after byte-identical remote read-back
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_AUTHORS: ${{ vars.COORDINATION_TRUSTED_AUTHORS || 'geromet' }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          ARCHIVE_REF: ${{ needs.prepare.outputs.archive_ref }}
        run: |
          set -euo pipefail
          python3 scripts/coordination_archive.py compact \
            --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE_NUMBER" \
            --trusted-authors "$TRUSTED_AUTHORS" \
            --archive-dir Phase0/archives/coordination \
            --archive-ref "$ARCHIVE_REF" \
            --tail-min 750 --confirm-delete
