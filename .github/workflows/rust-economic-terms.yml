name: Rust economic terms synthetic checks

on:
  push:
    paths:
      - 'Phase0/rust-economic-terms/**'
      - '.github/workflows/rust-economic-terms.yml'
  pull_request:
    paths:
      - 'Phase0/rust-economic-terms/**'
      - '.github/workflows/rust-economic-terms.yml'

permissions:
  contents: read

jobs:
  offline-model:
    runs-on: ubuntu-24.04
    steps:
      - name: Exact-SHA Git checkout (no Node actions)
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install pinned Rust 1.85.1 without JavaScript actions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Locked Rustfmt, tests and strict Clippy
        shell: bash
        working-directory: Phase0/rust-economic-terms
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all --check
          cargo +1.85.1 test --locked --offline
          cargo +1.85.1 clippy --all-targets --locked --offline -- -D warnings
