[package]
name = "free-energy-catalog"
default-run = "free-energy-catalog"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Experimental typed boundary for the FREE ENERGY offline project catalog"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lib]
path = "src/lib.rs"

[[bin]]
name = "free-energy-catalog"
path = "src/main.rs"
